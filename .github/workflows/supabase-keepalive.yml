name: supabase-keepalive
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Auth health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "https://uajpehehwmiyklmsrcqy.supabase.co/auth/v1/health" -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase Auth health status: $code"
          test "$code" = "200"
